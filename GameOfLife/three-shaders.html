<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>WebGPU Game of Life — three shaders</title>
    </head>
    <body>
        <canvas width="512" height="512"></canvas>

        <script type="module">
            // Conway's Game of Life on the GPU, with each shader stage doing
            // real work instead of two of them punting to the third:
            //   - compute:  advances one generation, ping-ponging between
            //               two copies of the state buffer.
            //   - vertex:   runs once per cell (via instancing), looks up
            //               that cell's state, and scales a shared quad down
            //               to nothing if the cell is dead.
            //   - fragment: colors the surviving quads with a gradient based
            //               on their grid position, so it's doing more than
            //               returning a constant.

            const GRID_WIDTH = 32
            const GRID_HEIGHT = 32
            const CELL_SIZE = 16 // pixels per cell, used only for canvas sizing
            const UPDATE_INTERVAL = 100 // ms between generations
            const WORKGROUP_SIZE = 8

            if (!navigator.gpu) throw new Error('WebGPU not supported.')
            const adapter = await navigator.gpu.requestAdapter()
            if (!adapter) throw new Error('No GPUAdapter found.')
            const device = await adapter.requestDevice()

            const canvas = document.querySelector('canvas')
            const context = canvas.getContext('webgpu')
            const format = navigator.gpu.getPreferredCanvasFormat()
            context.configure({ device, format, alphaMode: 'opaque' })

            // --- Vertex data -----------------------------------------------------------

            // One quad, shared by every cell instance. Scaled to 0.8 so dead-vs-alive
            // cells read as distinct squares with a gap between them, same effect
            // simple.html got from a margin check in its fragment shader.
            // prettier-ignore
            const quadVertices = new Float32Array([
                -0.8, -0.8,
                 0.8, -0.8,
                 0.8,  0.8,
                -0.8, -0.8,
                 0.8,  0.8,
                -0.8,  0.8,
            ])

            const vertexBuffer = device.createBuffer({
                size: quadVertices.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            })
            device.queue.writeBuffer(vertexBuffer, 0, quadVertices)

            const vertexBufferLayout = {
                arrayStride: 8,
                attributes: [{ format: 'float32x2', offset: 0, shaderLocation: 0 }],
            }

            // --- Bind group layout -----------------------------------------------------

            // Shared by both pipelines: binding 1 (current state) is read by the
            // vertex stage to position/scale each cell's quad, and read by the
            // compute stage as its input generation. Binding 2 (next state) is
            // written only by compute.
            const bindGroupLayout = device.createBindGroupLayout({
                entries: [
                    {
                        binding: 0,
                        visibility:
                            GPUShaderStage.VERTEX |
                            GPUShaderStage.FRAGMENT |
                            GPUShaderStage.COMPUTE,
                        buffer: {}, // Params uniform
                    },
                    {
                        binding: 1,
                        visibility: GPUShaderStage.VERTEX | GPUShaderStage.COMPUTE,
                        buffer: { type: 'read-only-storage' }, // current state
                    },
                    {
                        binding: 2,
                        visibility: GPUShaderStage.COMPUTE,
                        buffer: { type: 'storage' }, // next state
                    },
                ],
            })
            const pipelineLayout = device.createPipelineLayout({
                bindGroupLayouts: [bindGroupLayout],
            })

            // --- Shaders -----------------------------------------------------------

            const computeShader = device.createShaderModule({
                code: `
    struct Params {
      width: u32,
      height: u32,
    }
    @group(0) @binding(0) var<uniform> params: Params;
    @group(0) @binding(1) var<storage, read> stateIn: array<u32>;
    @group(0) @binding(2) var<storage, read_write> stateOut: array<u32>;

    fn cellIndex(x: i32, y: i32) -> u32 {
      let w = i32(params.width);
      let h = i32(params.height);
      let xw = (x + w) % w;
      let yw = (y + h) % h;
      return u32(yw * w + xw);
    }

    @compute @workgroup_size(${WORKGROUP_SIZE}, ${WORKGROUP_SIZE})
    fn main(@builtin(global_invocation_id) gid: vec3u) {
      if (gid.x >= params.width || gid.y >= params.height) {
        return;
      }
      let x = i32(gid.x);
      let y = i32(gid.y);

      var neighbors = 0u;
      for (var dy = -1; dy <= 1; dy = dy + 1) {
        for (var dx = -1; dx <= 1; dx = dx + 1) {
          if (!(dx == 0 && dy == 0)) {
            neighbors = neighbors + stateIn[cellIndex(x + dx, y + dy)];
          }
        }
      }

      let alive = stateIn[cellIndex(x, y)];
      var next = 0u;
      if (alive == 1u && (neighbors == 2u || neighbors == 3u)) {
        next = 1u;
      } else if (alive == 0u && neighbors == 3u) {
        next = 1u;
      }
      stateOut[cellIndex(x, y)] = next;
    }
`,
            })

            const renderShader = device.createShaderModule({
                code: `
    struct Params {
      width: u32,
      height: u32,
    }
    @group(0) @binding(0) var<uniform> params: Params;
    @group(0) @binding(1) var<storage, read> state: array<u32>;

    struct VertexOutput {
      @builtin(position) pos: vec4f,
      @location(0) cell: vec2f,
    }

    @vertex
    fn vs(@location(0) quadPos: vec2f,
          @builtin(instance_index) instance: u32) -> VertexOutput {
      let grid = vec2f(f32(params.width), f32(params.height));
      let cell = vec2f(f32(instance) % grid.x, floor(f32(instance) / grid.x));
      let alive = f32(state[instance]);

      // Dead cells collapse their quad to a point instead of being culled
      // separately — same trick tutorial.html uses.
      let cellOffset = cell / grid * 2.0;
      let gridPos = (quadPos * alive + 1.0) / grid - 1.0 + cellOffset;

      var out: VertexOutput;
      out.pos = vec4f(gridPos, 0.0, 1.0);
      out.cell = cell;
      return out;
    }

    @fragment
    fn fs(in: VertexOutput) -> @location(0) vec4f {
      let grid = vec2f(f32(params.width), f32(params.height));
      // Color each surviving cell by its position in the grid, so the
      // fragment stage is doing more than returning a flat color.
      let uv = in.cell / grid;
      return vec4f(uv.x, 1.0 - uv.y, uv.y, 1.0);
    }
`,
            })

            // --- Buffers -------------------------------------------------------------

            const cellCount = GRID_WIDTH * GRID_HEIGHT

            const paramsBuffer = device.createBuffer({
                size: 8, // width: u32, height: u32
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            })
            device.queue.writeBuffer(
                paramsBuffer,
                0,
                new Uint32Array([GRID_WIDTH, GRID_HEIGHT]),
            )

            const stateBuffers = [
                device.createBuffer({
                    size: cellCount * 4,
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
                }),
                device.createBuffer({
                    size: cellCount * 4,
                    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
                }),
            ]

            const cellStateArray = new Uint32Array(cellCount)
            for (let i = 0; i < cellCount; i++) {
                cellStateArray[i] = Math.random() < 0.35 ? 1 : 0
            }
            device.queue.writeBuffer(stateBuffers[0], 0, cellStateArray)

            // --- Pipelines & bind groups ----------------------------------------------

            const computePipeline = device.createComputePipeline({
                layout: pipelineLayout,
                compute: { module: computeShader, entryPoint: 'main' },
            })

            const renderPipeline = device.createRenderPipeline({
                layout: pipelineLayout,
                vertex: {
                    module: renderShader,
                    entryPoint: 'vs',
                    buffers: [vertexBufferLayout],
                },
                fragment: {
                    module: renderShader,
                    entryPoint: 'fs',
                    targets: [{ format }],
                },
                primitive: { topology: 'triangle-list' },
            })

            // One bind group per ping-pong direction, shared by both pipelines:
            // binding 1 is "current state" for both the compute pass's input
            // and the render pass's read, binding 2 is compute's output only.
            function makeBindGroup(inIndex, outIndex) {
                return device.createBindGroup({
                    layout: bindGroupLayout,
                    entries: [
                        { binding: 0, resource: { buffer: paramsBuffer } },
                        { binding: 1, resource: { buffer: stateBuffers[inIndex] } },
                        { binding: 2, resource: { buffer: stateBuffers[outIndex] } },
                    ],
                })
            }
            const bindGroups = [makeBindGroup(0, 1), makeBindGroup(1, 0)]

            const workgroupsX = Math.ceil(GRID_WIDTH / WORKGROUP_SIZE)
            const workgroupsY = Math.ceil(GRID_HEIGHT / WORKGROUP_SIZE)

            // --- Main loop -------------------------------------------------------------

            let step = 0

            function updateGrid() {
                const parity = step % 2

                const encoder = device.createCommandEncoder()

                const computePass = encoder.beginComputePass()
                computePass.setPipeline(computePipeline)
                computePass.setBindGroup(0, bindGroups[parity])
                computePass.dispatchWorkgroups(workgroupsX, workgroupsY)
                computePass.end()

                step++

                const renderPass = encoder.beginRenderPass({
                    colorAttachments: [
                        {
                            view: context.getCurrentTexture().createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: 'clear',
                            storeOp: 'store',
                        },
                    ],
                })
                renderPass.setPipeline(renderPipeline)
                renderPass.setBindGroup(0, bindGroups[step % 2])
                renderPass.setVertexBuffer(0, vertexBuffer)
                renderPass.draw(quadVertices.length / 2, cellCount)
                renderPass.end()

                device.queue.submit([encoder.finish()])
            }

            setInterval(updateGrid, UPDATE_INTERVAL)
        </script>
    </body>
</html>
